# name of the workflow
name: CICD
#when does wokflow run
on: push
##jobs
jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v7

  build:
    needs: code
    runs-on: ubuntu-latest
    steps:
      - name: Code Build with docker
        uses: docker/login-action@v4
      - name: setuo docker
        uses: docker/setup-buildx-action@v4
  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Code test
        run: echo "Code test done"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Code Deploy
        run: echo "Code deploy done"
